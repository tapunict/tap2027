# Iceberg 1.12.0 provides a Spark 4.1 runtime; Spark 4.1.4 matches it.
spark.jars.packages                     org.apache.spark:spark-sql-kafka-0-10_2.13:4.1.4,org.apache.spark:spark-avro_2.13:4.1.4,org.apache.iceberg:iceberg-spark-runtime-4.1_2.13:1.12.0,org.apache.iceberg:iceberg-aws-bundle:1.12.0
spark.driver.extraJavaOptions           -Divy.cache.dir=/tmp/ivy-cache -Divy.home=/tmp/ivy-home

spark.sql.extensions                    org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# "lake" catalog: Iceberg REST catalog + data and metadata files in RustFS
spark.sql.catalog.lake                  org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lake.type             rest
spark.sql.catalog.lake.uri              http://iceberg-rest:8181
spark.sql.catalog.lake.warehouse        s3://lakehouse/warehouse
spark.sql.catalog.lake.io-impl          org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lake.s3.endpoint      http://rustfs:9000
spark.sql.catalog.lake.s3.path-style-access true
spark.sql.catalog.lake.client.region    us-east-1
spark.sql.defaultCatalog                lake
