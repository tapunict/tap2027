# Pizza lakehouse: Kafka (2 brokers) -> Spark Structured Streaming (2 workers)
# -> Apache Iceberg tables (REST catalog) stored in RustFS (S3-compatible).
#
# Lab credentials only. Do not expose these ports outside localhost.

x-s3-credentials: &s3-credentials
  AWS_ACCESS_KEY_ID: tapadmin
  AWS_SECRET_ACCESS_KEY: tapsecret123
  AWS_REGION: us-east-1

services:
  broker1:
    image: apache/kafka:4.4.0
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker1:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - broker1-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30

  broker2:
    image: apache/kafka:4.4.0
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker2:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker1:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - broker2-data:/var/lib/kafka/data
    depends_on:
      broker1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30

  registry:
    image: confluentinc/cp-schema-registry:8.2.2
    environment:
      SCHEMA_REGISTRY_HOST_NAME: registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://broker1:9092,PLAINTEXT://broker2:9092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 2
    ports:
      - "127.0.0.1:18081:8081"
    depends_on:
      broker1:
        condition: service_healthy
      broker2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  connect:
    build:
      context: .
      dockerfile: Dockerfile.connect
    environment:
      CONNECT_BOOTSTRAP_SERVERS: broker1:9092,broker2:9092
      CONNECT_REST_PORT: 8083
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_GROUP_ID: pizza-connect
      CONNECT_CONFIG_STORAGE_TOPIC: _pizza_connect_configs
      CONNECT_OFFSET_STORAGE_TOPIC: _pizza_connect_offsets
      CONNECT_STATUS_STORAGE_TOPIC: _pizza_connect_status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 2
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 2
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 2
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://registry:8081
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
    ports:
      - "127.0.0.1:18083:8083"
    depends_on:
      registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connector-plugins >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 36

  # --- Lakehouse storage: RustFS (Apache-2.0, S3-compatible, written in Rust)
  rustfs:
    image: rustfs/rustfs:1.0.5
    environment:
      RUSTFS_ACCESS_KEY: tapadmin
      RUSTFS_SECRET_KEY: tapsecret123
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOG_DIRECTORY: ""     # log to stdout (docker compose logs rustfs)
    ports:
      - "127.0.0.1:19000:9000"   # S3 API
      - "127.0.0.1:19001:9001"   # web console
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health/ready >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot job: create the bucket that holds the Iceberg warehouse.
  # `rc` is the RustFS CLI bundled in the image (mc-like syntax).
  rustfs-init:
    image: rustfs/rustfs:1.0.5
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        rc alias set lake http://rustfs:9000 tapadmin tapsecret123 &&
        rc bucket create --ignore-existing lake/lakehouse &&
        rc bucket list lake
    depends_on:
      rustfs:
        condition: service_healthy

  # --- Lakehouse catalog: Iceberg REST catalog (metadata pointers in SQLite)
  catalog-init:
    image: apache/iceberg-rest-fixture:1.10.1
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown iceberg:iceberg /catalog"]
    volumes:
      - catalog-data:/catalog

  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.1
    environment:
      <<: *s3-credentials
      CATALOG_URI: jdbc:sqlite:/catalog/iceberg_catalog.db
      CATALOG_WAREHOUSE: s3://lakehouse/warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://rustfs:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports:
      - "127.0.0.1:18181:8181"
    volumes:
      - catalog-data:/catalog
    depends_on:
      catalog-init:
        condition: service_completed_successfully
      rustfs-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8181/v1/config >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  # --- Spark: 1 master, 2 workers, 1 driver (profile "spark")
  # Workers need no shared volume: data files go to RustFS (S3 API).
  spark-storage-init:
    image: apache/spark:4.1.4
    profiles: ["spark"]
    user: root
    entrypoint: ["/bin/bash", "-c"]
    command: ["mkdir -p /work/pizza-lakehouse && chown -R spark:spark /work"]
    volumes:
      - spark-data:/work

  spark-master:
    image: apache/spark:4.1.4
    profiles: ["spark"]
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    ports:
      - "127.0.0.1:18080:8080"

  spark-worker1:
    image: apache/spark:4.1.4
    profiles: ["spark"]
    environment:
      <<: *s3-credentials
      SPARK_WORKER_CORES: 1
      SPARK_WORKER_MEMORY: 1g
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "--host", "spark-worker1", "spark://spark-master:7077"]
    depends_on:
      spark-master:
        condition: service_started

  spark-worker2:
    image: apache/spark:4.1.4
    profiles: ["spark"]
    environment:
      <<: *s3-credentials
      SPARK_WORKER_CORES: 1
      SPARK_WORKER_MEMORY: 1g
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "--host", "spark-worker2", "spark://spark-master:7077"]
    depends_on:
      spark-master:
        condition: service_started

  # Streaming driver. spark-defaults.conf configures the "lake" Iceberg catalog,
  # so `docker compose exec spark spark-sql` can query the same tables.
  spark:
    image: apache/spark:4.1.4
    profiles: ["spark"]
    environment:
      <<: *s3-credentials
    ports:
      - "127.0.0.1:14040:4040"
    volumes:
      - ./pizza_lakehouse.py:/opt/pizza/pizza_lakehouse.py:ro
      - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - spark-data:/opt/spark/work-dir
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --total-executor-cores
      - "2"
      - --executor-cores
      - "1"
      - --executor-memory
      - 1g
      - --conf
      - spark.driver.host=spark
      - --conf
      - spark.scheduler.minRegisteredResourcesRatio=1
      - --conf
      - spark.scheduler.maxRegisteredResourcesWaitingTime=120s
      - /opt/pizza/pizza_lakehouse.py
    depends_on:
      connect:
        condition: service_healthy
      registry:
        condition: service_healthy
      iceberg-rest:
        condition: service_healthy
      spark-worker1:
        condition: service_started
      spark-worker2:
        condition: service_started
      spark-storage-init:
        condition: service_completed_successfully

volumes:
  broker1-data:
  broker2-data:
  rustfs-data:
  catalog-data:
  spark-data:
